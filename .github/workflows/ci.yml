# Continuous integration: nothing is merged unless lint + tests pass.
# This workflow only reads the repo and publishes nothing. On pull requests it also builds the
# images and scans them; publishing is build-push.yml, which CALLS this workflow first.
# See docs/DEVOPS_GUIDE.md §3.
name: ci

on:
  pull_request:
  # Lets build-push.yml run this whole workflow as its first step (a "reusable workflow").
  # There is deliberately no `push: main` trigger: on main, build-push.yml runs CI exactly once.
  workflow_call:

# Least privilege: the automatic GITHUB_TOKEN may only read the repository.
permissions:
  contents: read

# A newer push to the same branch/PR makes the older, now-pointless run stop.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned by FULL COMMIT SHA, not by tag: a tag can be moved to different
# code later, a commit SHA cannot. The version stays in the comment so humans can read it.
# (Dependabot will bump these in P6.)
jobs:
  backend:
    name: backend (ruff + pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    # Real Postgres and Redis next to the job, exactly like local docker compose. No mocks.
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_USER: linkforge
          # Throwaway value: this database exists only for the duration of this job.
          POSTGRES_PASSWORD: linkforge_dev
          POSTGRES_DB: linkforge
        ports: ["5432:5432"]
        # The job waits until the database reports healthy before the steps start.
        options: >-
          --health-cmd "pg_isready -U linkforge -d linkforge"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7.4
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # The test suite creates this database itself if it is missing (decision D36).
      TEST_DATABASE_URL: postgresql+asyncpg://linkforge:linkforge_dev@localhost:5432/linkforge_test

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Later steps never push, so do not leave the token in .git/config.
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies (exact pinned versions)
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Tests (real Postgres and Redis)
        run: pytest -q

  # The web app. Same four gates as `npm run lint && npm run typecheck && npm test && npm run
  # build` locally (frontend/CLAUDE.md). The tests need no services: the network is faked at the
  # fetch boundary (MSW), nothing else is. `npm ci` installs exactly what package-lock.json says
  # and fails if package.json and the lock file disagree.
  frontend:
    name: frontend (eslint + tsc + vitest + build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (exactly the lock file)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  # Terraform, offline: format, validate and Checkov. No AWS credentials exist in this job and none
  # are needed: `init -backend=false` only downloads the provider, `validate` only reads the code,
  # and nothing is planned or applied (that is done by a human, never by CI).
  # The Terraform binary is pinned by version AND sha256 (published in
  # terraform_<version>_SHA256SUMS), like gitleaks and Trivy; Checkov is pinned by version.
  terraform:
    name: terraform (fmt + validate + checkov)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Terraform (pinned, checksum verified)
        env:
          TERRAFORM_VERSION: "1.17.1"
          TERRAFORM_SHA256: 4638628058e71a55212b1c563712eac03b902128f40740f3dc8174df12135061
        run: |
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 2 -o terraform.zip \
            "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          echo "${TERRAFORM_SHA256}  terraform.zip" | sha256sum --check --strict
          unzip -q terraform.zip terraform
          sudo mv terraform /usr/local/bin/terraform
          rm terraform.zip
          terraform version

      - name: Format, init (no backend) and validate every stack
        run: |
          terraform fmt -check -diff -recursive infra/terraform
          for dir in infra/terraform/*/; do
            if ls "$dir"*.tf > /dev/null 2>&1; then
              echo "== $dir"
              terraform -chdir="$dir" init -backend=false -input=false
              terraform -chdir="$dir" validate
            fi
          done

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # Checkov reads the Terraform and reports insecure settings. Every skip lives next to the code
      # it applies to, with its reason (#checkov:skip=ID:reason), so a reviewer sees it.
      - name: Checkov (blocking)
        run: |
          pip install checkov==3.4.3
          checkov -d infra/terraform --framework terraform --quiet --compact

  # Trivy on the repository FILES: known-vulnerable dependencies are caught here, before any image
  # is built. Same pinned binary, severity and exception file (.trivyignore) as the image gate.
  trivy-fs:
    name: trivy (repository files)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/fs-scan

  # Builds both images WITHOUT pushing and applies the Trivy gate, so a broken Dockerfile or a
  # vulnerable base image fails the pull request, not the deploy. Skipped when this workflow is
  # called from build-push.yml (event_name is then the caller's "push"): that workflow builds,
  # scans and pushes the very same images itself.
  images:
    name: images (build + trivy)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: api, context: backend}
          - {name: frontend, context: frontend}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build ${{ matrix.name }} image (not pushed)
        env:
          SERVICE: ${{ matrix.name }}
          CONTEXT: ${{ matrix.context }}
        run: docker build -t "linkforge-${SERVICE}:ci" "$CONTEXT"
      - uses: ./.github/actions/image-scan
        with:
          image: linkforge-${{ matrix.name }}:ci

  # BLOCKING since P6: a known vulnerability in a pinned dependency fails the run (it was advisory
  # while the project was being built). Python: pip-audit on the exact pins. JavaScript: npm audit
  # on the lock file, production dependencies only and HIGH or worse (the 10 moderate findings
  # that exist are in build tooling, not in what ships).
  dependency-audit:
    name: dependency audit (pip-audit + npm audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Audit pinned dependencies against known vulnerabilities
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r backend/requirements.txt -r backend/requirements-dev.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Audit the JavaScript lock file (production dependencies, HIGH or worse)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  # BLOCKING since P6: a secret anywhere in the git history fails the run.
  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the whole history: a secret removed in a later commit is still leaked
          persist-credentials: false
      # We run the gitleaks binary directly instead of its GitHub Action: the Action ships under a
      # custom licence and phones a licence server, the binary is MIT. A pinned version plus a
      # SHA-256 check means a swapped release asset cannot run in our pipeline.
      - name: Install gitleaks (pinned version, checksum verified)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan the git history for secrets
        run: ./gitleaks git --redact --verbose --no-banner .
