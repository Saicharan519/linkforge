# Local Kubernetes cluster: "kind" runs a whole cluster INSIDE Docker (here: one container that
# acts as the control plane AND the worker). Create it with:
#   kind create cluster --config infra/kind/kind-config.yaml
# The cluster name below becomes the kubectl context "kind-linkforge".
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: linkforge
nodes:
  - role: control-plane
    # The Kubernetes version is decided by this node image. Pinned by tag AND digest (same reason
    # as our Dockerfiles: a tag can be re-pointed, a digest cannot). v1.35 is within one minor
    # version of the kubectl in WSL (1.36), which is the supported skew.
    image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
    extraPortMappings:
      # How a browser on YOUR machine reaches the cluster: host port 80 is forwarded into the node
      # container's port 30080. Traefik's Service is a NodePort on exactly 30080 (traefik-values.yaml),
      # so: browser -> localhost:80 -> node :30080 -> Traefik -> Ingress rules -> our Services.
      # 127.0.0.1 only: nothing on your network can reach it.
      - containerPort: 30080
        hostPort: 80
        listenAddress: "127.0.0.1"
        protocol: TCP
