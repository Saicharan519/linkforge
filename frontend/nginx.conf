# Web server for the built app (P5.2).
#
# Compose (docker compose up): this nginx is the front door on :8080. It serves the app and
# forwards /api/ to the API container, so the browser only ever talks to ONE origin (no CORS).
# Kubernetes: the Ingress already sends /api to the API Service and everything else here, so the
# /api/ block below is simply never reached there. It points at the name `api`, which is the
# compose service AND the Kubernetes Service, so the same file works in both.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Version string in the Server header helps attackers, nothing else.
    server_tokens off;

    # Compress text files. (Fonts are already compressed.)
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Liveness/readiness target. Answered by nginx itself, no file needed.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The API. No trailing slash on proxy_pass: the path is forwarded unchanged (/api/v1/...).
    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        # The API decides rate limits and visitor hashes by client IP and trusts exactly one
        # proxy hop (TRUSTED_PROXY_COUNT=1): so OVERWRITE the header with the address nginx saw,
        # never append to one a client sent.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }

    # Files in /assets/ have a content hash in their name (index-DOdeUhcv.js): a changed file gets a
    # new name, so the browser may keep the old one for a year without ever asking again.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Everything else is the app. Unknown paths serve index.html so client-side routes survive a
    # reload. index.html names the hashed files, so it must always be re-checked (no-cache).
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
