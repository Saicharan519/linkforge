# Static server for the frontend. No /api proxy here: in Kubernetes the Ingress routes /api to the
# API service (ARCHITECTURE §11). The compose-only proxy is added with the real SPA in P4/P5.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Version string in the Server header helps attackers, nothing else.
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Liveness/readiness target. Answered by nginx itself, no file needed.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # SPA fallback: unknown paths serve index.html so client-side routes survive a refresh.
    location / {
        try_files $uri /index.html;
    }
}
