# HTTP security headers for everything nginx serves (ARCHITECTURE section 10).
#
# This is a separate file, included by every `location` that sets its own headers, because of an
# nginx rule that surprises people: `add_header` in a location REPLACES all `add_header` lines of
# the level above instead of adding to them. Repeating the list by hand would let one location
# quietly lose its protections; one included file cannot drift.
#
# Content-Security-Policy, directive by directive:
#   default-src 'self'      anything not named below may only come from our own origin
#   script-src 'self'       only our own bundle runs; no inline scripts, no eval, no other sites
#   style-src ... 'unsafe-inline'
#                           the chart library and the dialog's scroll lock write <style> rules at
#                           run time; without this they would be blocked. Styles are far less
#                           dangerous than scripts (script-src stays strict).
#   img-src 'self' data:    our own images plus small inline ones (data: URIs)
#   font-src 'self'         the fonts are served by us (@fontsource), not by Google
#   connect-src 'self'      the app may call only its own origin (the /api proxy)
#   object-src 'none'       no plugins
#   base-uri 'self'         nobody can change what relative URLs mean
#   form-action 'self'      forms can only submit to us
#   frame-ancestors 'none'  nobody can put the app in an iframe (clickjacking); the modern twin
#                           of X-Frame-Options below
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
