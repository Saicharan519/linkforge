# LinkForge API contract (skeleton) — P0.5
# Source of truth is ARCHITECTURE.md §4 + PRD.md; gaps are filled by DECISIONS.md D23–D35.
# The generated OpenAPI of the real app (served at /api/openapi.json when ENABLE_DOCS=true) must match this.
openapi: 3.1.0
info:
  title: LinkForge API
  version: 1.0.0-skeleton
  description: |
    URL shortener + click analytics.
    - `/api/v1` is additive-only; breaking changes need `/api/v2`.
    - The redirect `GET|HEAD /{code}`, `/healthz` and `/readyz` live at the root (not under /api/v1).
    - On the public short-link host ONLY `GET|HEAD /{code}` is served; everything else is 404.
    - Unsafe cookie-authenticated requests need `X-CSRF-Token` (== `lf_csrf` cookie) AND an allowed `Origin`.
      API-key requests skip CSRF. The Origin check also applies to register/login (D25).
servers:
  - url: http://localhost:8000
tags:
  - name: ops
  - name: redirect
  - name: auth
  - name: links
  - name: analytics
  - name: api-keys

paths:
  /healthz:
    get:
      tags: [ops]
      summary: Liveness (process is up)
      responses:
        "200":
          description: Alive
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /readyz:
    get:
      tags: [ops]
      summary: Readiness. Postgres required; Redis down = degraded but still ready.
      responses:
        "200":
          description: Ready (redis may be "degraded")
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ready" }
        "503":
          description: Postgres unreachable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ready" }

  /{code}:
    parameters:
      - name: code
        in: path
        required: true
        schema: { type: string, minLength: 3, maxLength: 32, pattern: "^[A-Za-z0-9_-]+$" }
    get:
      tags: [redirect]
      summary: Follow a short link (302). Registered LAST in the app.
      description: |
        Order: rate limit (fails open) -> cache -> negative cache -> Postgres.
        Disabled beats expired (disabled -> 404 even if also expired). Enqueues a click event (best effort).
      responses:
        "302":
          description: Redirect to the destination
          headers:
            Location: { schema: { type: string, format: uri } }
        "404": { $ref: "#/components/responses/NotFound" }
        "410":
          description: Link expired
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
    head:
      tags: [redirect]
      summary: Same status and Location as GET, no body. NEVER counted as a click (D12).
      responses:
        "302":
          description: Redirect
          headers:
            Location: { schema: { type: string, format: uri } }
        "404": { description: Unknown or disabled }
        "410": { description: Expired }
        "429": { description: Rate limited }
        "503": { description: Postgres unavailable on a cache miss }

  /api/v1/auth/register:
    post:
      tags: [auth]
      summary: "Register (email normalised: trimmed + lowercased; password 10-128 chars)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Email already registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Login. Sets lf_session (HttpOnly) and lf_csrf cookies; rotates any existing session.
      description: Wrong password and unknown email return the same 401. Limit 5 failed / 15 min per IP+email; fails closed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Logged in
          headers:
            Set-Cookie: { schema: { type: string }, description: "lf_session and lf_csrf" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/InvalidCredentials" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Destroy the current session server-side and clear cookies
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      responses:
        "204": { description: Logged out }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/auth/me:
    get:
      tags: [auth]
      summary: Current user
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/auth/change-password:
    post:
      tags: [auth]
      summary: Change password. Revokes all OTHER sessions; API keys are NOT revoked.
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "204": { description: Changed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/links:
    post:
      tags: [links]
      summary: Create a link. Per-user limit 30/min shared by session and all API keys (fails closed).
      security: [{ cookieAuth: [] }, { apiKeyAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LinkCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Link" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Alias already taken
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
    get:
      tags: [links]
      summary: List own links, newest first
      security: [{ cookieAuth: [] }, { apiKeyAuth: [] }]
      parameters:
        - name: q
          in: query
          description: Search in code, title and destination URL
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/LinkStatus" }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: A page of links
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinkList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/links/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [links]
      summary: Get own link (404 if not the owner)
      security: [{ cookieAuth: [] }, { apiKeyAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Link" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [links]
      summary: Partial update. Omitted = unchanged; explicit null clears title / expires_at; destination_url and is_active cannot be null.
      security: [{ cookieAuth: [] }, { apiKeyAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LinkPatch" }
      responses:
        "200":
          description: Updated (cache keys deleted after commit)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Link" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [links]
      summary: Permanently delete the link and its click data
      security: [{ cookieAuth: [] }, { apiKeyAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/links/{id}/analytics:
    get:
      tags: [analytics]
      summary: Per-link analytics. Bots excluded; daily labels are UTC YYYY-MM-DD strings, zero-filled.
      security: [{ cookieAuth: [] }, { apiKeyAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/Range" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinkAnalytics" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/analytics/overview:
    get:
      tags: [analytics]
      summary: Overview across all own links
      security: [{ cookieAuth: [] }, { apiKeyAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Range" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Overview" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/api-keys:
    post:
      tags: [api-keys]
      summary: Create a key. The plaintext is returned ONCE; only sha256 + prefix are stored.
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApiKeyCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKeyCreated" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
    get:
      tags: [api-keys]
      summary: List own keys (prefix, name, created, last used)
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ApiKey" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/api-keys/{id}:
    delete:
      tags: [api-keys]
      summary: Revoke a key (takes effect immediately)
      security: [{ cookieAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/CsrfToken" }
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: lf_session
      description: Server-side Redis session. HttpOnly, SameSite=Lax, Secure in prod, host-only.
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: "Format lf_<prefix8>_<secret>. If present it takes precedence over cookies (D26)."
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Required on unsafe cookie-authenticated requests; must equal the lf_csrf cookie. Not needed with X-API-Key.
      schema: { type: string }
    Range:
      name: range
      in: query
      description: Last N UTC calendar days including today (today is partial). Default 30d.
      schema: { type: string, enum: ["7d", "30d", "90d"], default: "30d" }
  responses:
    Unauthorized:
      description: Missing, malformed, expired or revoked session / API key. Session cookies are cleared.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    InvalidCredentials:
      description: Wrong password or unknown email (identical response)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: CSRF token missing/invalid or Origin not allowed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: Unknown, disabled, or not owned by the caller
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    ValidationError:
      description: Invalid input; details lists the offending fields
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    RateLimited:
      description: Too many requests
      headers:
        Retry-After: { schema: { type: integer }, description: Seconds until the window resets }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unavailable:
      description: A required dependency (Postgres, or Redis for fail-closed paths) is unavailable
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - validation_error
                - unauthorized
                - invalid_credentials
                - csrf_failed
                - not_found
                - gone
                - alias_taken
                - email_taken
                - rate_limited
                - unavailable
                - internal_error
            message: { type: string }
            details:
              type: array
              description: For validation_error, one entry per invalid field
              items:
                type: object
                required: [field, message]
                properties:
                  field: { type: string }
                  message: { type: string }
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok] }
    Ready:
      type: object
      required: [status, postgres, redis]
      properties:
        status: { type: string, enum: [ok, unavailable] }
        postgres: { type: string, enum: [ok, down] }
        redis: { type: string, enum: [ok, degraded] }
    User:
      type: object
      required: [id, email, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email, maxLength: 254 }
        created_at: { type: string, format: date-time }
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, maxLength: 254 }
        password: { type: string, minLength: 10, maxLength: 128 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }
    ChangePasswordRequest:
      type: object
      required: [old_password, new_password]
      properties:
        old_password: { type: string }
        new_password: { type: string, minLength: 10, maxLength: 128 }
    LinkStatus:
      type: string
      description: disabled if is_active=false; else expired if expires_at <= now; else active.
      enum: [active, disabled, expired]
    LinkCreate:
      type: object
      required: [destination_url]
      properties:
        destination_url:
          type: string
          maxLength: 2048
          description: http/https only; must not point at our own short domain
        alias:
          type: string
          minLength: 3
          maxLength: 32
          pattern: "^[A-Za-z0-9_-]+$"
          description: Case-sensitive, stored as typed; reserved-word check is case-insensitive
        title: { type: string, maxLength: 200 }
        expires_at: { type: string, format: date-time, description: Must be in the future }
    LinkPatch:
      type: object
      description: Omitted field = unchanged. title and expires_at may be explicit null (clears). destination_url and is_active cannot be null.
      properties:
        destination_url: { type: string, maxLength: 2048 }
        is_active: { type: boolean }
        title: { type: [string, "null"], maxLength: 200 }
        expires_at: { type: [string, "null"], format: date-time }
    Link:
      type: object
      required: [id, code, short_url, destination_url, is_active, created_at, updated_at, status, total_clicks]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        short_url: { type: string, format: uri, description: Built server-side from SHORT_URL_BASE }
        destination_url: { type: string }
        title: { type: [string, "null"] }
        is_active: { type: boolean }
        expires_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/LinkStatus" }
        total_clicks: { type: integer, minimum: 0, description: "Sum of daily rollups; bots excluded" }
    LinkList:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Link" }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100 }
    DayCount:
      type: object
      required: [day, clicks]
      properties:
        day: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$", description: "UTC calendar date; render as-is" }
        clicks: { type: integer, minimum: 0 }
    LinkAnalytics:
      type: object
      required: [total, series, referrers, devices, browsers]
      properties:
        total: { type: integer, minimum: 0 }
        series:
          type: array
          items: { $ref: "#/components/schemas/DayCount" }
        referrers:
          type: array
          description: Top 10; empty referrer is reported as host "(direct)"
          items:
            type: object
            required: [host, clicks]
            properties:
              host: { type: string }
              clicks: { type: integer, minimum: 0 }
        devices:
          type: array
          items:
            type: object
            required: [device_type, clicks]
            properties:
              device_type: { type: string, enum: [desktop, mobile, tablet, other] }
              clicks: { type: integer, minimum: 0 }
        browsers:
          type: array
          description: Top 10
          items:
            type: object
            required: [browser, clicks]
            properties:
              browser: { type: string }
              clicks: { type: integer, minimum: 0 }
    Overview:
      type: object
      required: [total_links, total_clicks, series, top_links]
      properties:
        total_links: { type: integer, minimum: 0 }
        total_clicks: { type: integer, minimum: 0 }
        series:
          type: array
          items: { $ref: "#/components/schemas/DayCount" }
        top_links:
          type: array
          description: Top 5 by clicks in the range
          items:
            type: object
            required: [id, code, clicks]
            properties:
              id: { type: string, format: uuid }
              code: { type: string }
              title: { type: [string, "null"] }
              clicks: { type: integer, minimum: 0 }
    ApiKeyCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
    ApiKey:
      type: object
      required: [id, name, prefix, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        prefix: { type: string, description: First 8 chars after "lf_" }
        created_at: { type: string, format: date-time }
        last_used_at: { type: [string, "null"], format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }
    ApiKeyCreated:
      allOf:
        - $ref: "#/components/schemas/ApiKey"
        - type: object
          required: [key]
          properties:
            key: { type: string, description: "Full plaintext key; shown only in this response" }
