# Local stack for development and tests.
#   docker compose up -d postgres redis     -> only the dependencies (run the app yourself with uvicorn)
#   docker compose up --build api           -> postgres + one-shot migration + the API in a container
#   docker compose up --build               -> everything: the app on http://localhost:8080
#                                              (nginx serves the UI and forwards /api to the API),
#                                              the API alone on :8000 (short links open there),
#                                              the click worker, Postgres and Redis.
# Start-up order is enforced by `depends_on` + healthchecks: Postgres healthy -> migrate finishes ->
# API healthy -> frontend. Credentials are throwaway local values; override them with a
# gitignored .env file if you like.

# Shared by `migrate` and `api`: the SAME image, built once from ./backend. YAML anchors (&name /
# <<: *name) are just copy-paste avoidance, Compose has no special meaning for them.
x-backend: &backend
  build: ./backend
  image: linkforge-api:dev
  environment:
    # Inside the compose network the database is reached by its SERVICE NAME ("postgres"), not
    # localhost: Compose gives every service a DNS name on a private network.
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-linkforge}:${POSTGRES_PASSWORD:-linkforge_dev}@postgres:5432/${POSTGRES_DB:-linkforge}
    # Same idea as the database: the Redis SERVICE NAME, reachable on the compose network.
    REDIS_URL: redis://redis:6379/0
    # Pages allowed to make state-changing requests with a session cookie (CSRF Origin check):
    # the compose UI on :8080 and the Vite dev server on :5173. Empty would allow nothing.
    ALLOWED_ORIGINS: http://localhost:8080,http://localhost:5173
    # Keys the HMAC that replaces every client IP before it is stored (click events). A throwaway
    # value for local use only; real environments take it from a Secret. 16+ characters.
    IP_HASH_SECRET: ${IP_HASH_SECRET:-local-dev-only-ip-hash-secret}
    # Hostname of the PUBLIC short-link host. Empty = no host guard (everything served on any host).
    # To try the guard locally: PUBLIC_REDIRECT_HOST=go.example.com docker compose up -d api
    PUBLIC_REDIRECT_HOST: ${PUBLIC_REDIRECT_HOST:-}
    # How many of OUR proxies sit in front of the API. In this stack the nginx in the frontend
    # container forwards /api and OVERWRITES X-Forwarded-For with the address it saw, so exactly
    # one hop is trusted (ARCHITECTURE section 6.3). Direct calls to :8000 carry no such header and
    # fall back to the connection address. (Seen from a browser on this machine, every visitor
    # shares the Docker gateway address: fine locally, real clients differ on kind and EKS.)
    TRUSTED_PROXY_COUNT: "1"
    ENV: dev
    SHORT_URL_BASE: http://localhost:8000

services:
  # Runs the Alembic migrations ONCE and exits. The API waits for it to finish successfully, which
  # is the local twin of the Kubernetes migration Job (ARCHITECTURE §11).
  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    healthcheck:
      disable: true # a short-lived job has nothing to health-check

  api:
    <<: *backend
    ports:
      # 127.0.0.1 only: reachable from this machine, not from your network.
      - "127.0.0.1:8000:8000"
      # Prometheus metrics: their own port, local machine only (never an Ingress or public host).
      - "127.0.0.1:9101:9101"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      # Started so the local stack is complete, but NOT required to be healthy: the API must keep
      # working with Redis down (ARCHITECTURE §2.1), so this only orders the start-up.
      redis:
        condition: service_started
    restart: unless-stopped

  # The click worker (P3.2): the SAME image as the API, a different command. It reads click events
  # from the Redis stream and stores them in Postgres. No port: nothing connects to it.
  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    ports:
      # the worker's metrics (ARCHITECTURE section 1.2), local machine only
      - "127.0.0.1:9100:9100"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      disable: true # the image's check probes the API's port; the worker has none

  # The web app (P5.2): the built React app behind nginx, which also forwards /api/ to the API
  # container, so the browser talks to ONE origin (http://localhost:8080) and needs no CORS.
  # Its HEALTHCHECK comes from the image. Waits for a HEALTHY API: opening the UI before the API
  # can answer would show errors.
  frontend:
    build: ./frontend
    image: linkforge-frontend:dev
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-linkforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-linkforge_dev}
      POSTGRES_DB: ${POSTGRES_DB:-linkforge}
    ports:
      # Bound to 127.0.0.1 so the database is not exposed to your network. The host port can be
      # changed (POSTGRES_PORT) if something else on your machine already uses 5432.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # $$ stops compose from substituting; the variables are read inside the container.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4
    # The same flags as the Kubernetes chart (ARCHITECTURE section 5.1, D64), so local behaves like
    # the cluster: AOF on (survives a restart), fsync every second, a 256 MB memory cap and
    # `noeviction` (when full, Redis REFUSES writes instead of silently dropping data such as
    # sessions and queued clicks), and the AOF is rewritten when it doubles past 64 MB.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
      - --auto-aof-rewrite-percentage
      - "100"
      - --auto-aof-rewrite-min-size
      - 64mb
    ports:
      # REDIS_PORT: e.g. when a Redis installed on the machine itself already owns 6379.
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
